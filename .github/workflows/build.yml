name: KB-RPCS3 PS5 Build

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout KB-RPCS3
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            git \
            python3 \
            python3-pip \
            pkg-config \
            clang \
            lld \
            llvm

      - name: Inspect required PS5 build environment
        run: |
          echo "Checking build scripts and dependencies..."
          sed -n '1,100p' BUILDING.md
          echo "---- RPCS3 build script ----"
          sed -n '1,100p' port/rpcs3-build.sh
          echo "---- Application build script ----"
          sed -n '1,100p' tools/vm-build-app.sh

      - name: Upload build instructions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kb-rpcs3-build-requirements
          path: |
            BUILDING.md
            port/
            tools/
